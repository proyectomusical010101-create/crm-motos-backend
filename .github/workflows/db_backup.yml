name: Automated Database Backup

on:
  schedule:
    # Corre cada 2 días a las 00:00 UTC (8:00 PM hora México)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Permite dispararlo de forma manual desde la pestaña Actions en GitHub

permissions:
  contents: write # Requerido para poder hacer push de vuelta al repositorio

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema=schema.prisma

      - name: Run database backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node db_backup.js

      - name: Commit and push database backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No hay cambios o respaldos nuevos que subir."
          else
            git commit -m "chore: respaldo automático de base de datos $(date +'%Y-%m-%d')"
            git push origin main
          fi
